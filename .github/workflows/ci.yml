name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install → lint → typecheck → test → build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint .
      - name: Format check
        run: pnpm exec prettier --check .
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - name: Build (all packages)
        run: pnpm exec turbo run build
      - name: Prisma schema validate
        run: pnpm run prisma:validate
        env:
          DATABASE_URL: postgresql://montr:montr@localhost:5432/montr?schema=public

  self-scan:
    name: self-scan (dogfood) — placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-scan (wired in Wave 1/2 by WS-N)
        run: echo "self-scan (dogfood, section 14) is wired in Wave 1/2 by WS-N - placeholder"

  golden-corpus:
    name: golden-corpus gate — placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Precision/recall gate (wired by WS-P)
        run: echo "golden-corpus precision/recall gate (section 15) is wired by WS-P - placeholder"

  docker:
    name: docker build (compose images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose
        run: |
          cp deploy/docker/.env.example deploy/docker/.env
          docker compose -f deploy/docker/docker-compose.yml config -q
      - name: Build images
        run: docker compose -f deploy/docker/docker-compose.yml build

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/montr-secure
      - name: helm template
        run: helm template montr deploy/helm/montr-secure > /dev/null
