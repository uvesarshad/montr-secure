# =============================================================================
# Montr Secure — CI (build-plan §3.7 / §4.7 / §4.8).
#
# Pipeline: install → lint → typecheck → test → build, plus:
#   - golden-corpus  : precision/recall/FP-rate regression gate (@montr/qa), non-zero on regression,
#                      plus the A23 model-variance matrix (per-model accuracy-cliff check) and the
#                      B12 blue-team detection-corpus gate (detection precision/recall, non-zero on regression).
#   - self-scan      : dogfood Semgrep SAST + Gitleaks secrets on our OWN source.
#   - docker         : compose config validate + image build.
#   - helm           : lint (strict) + template (permutations) + kubeconform.
#   - supply-chain   : syft SBOM + cosign signing (guarded/best-effort).
#
# Node 20 LTS throughout. Least-privilege default token; jobs opt into more.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (read-only). Jobs that need more elevate locally.
permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # install → lint → typecheck → test → build (all packages).
  # ---------------------------------------------------------------------------
  build:
    name: install → lint → typecheck → test → build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint .
      - name: Format check
        run: pnpm exec prettier --check .
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unwired-seam check (A10 — every declared production seam must have a real caller)
        run: pnpm run check:unwired-seams
      - name: Unit tests
        run: pnpm run test
      - name: Coverage thresholds (build-plan §4.7 — fails on regression below vitest.config.ts thresholds)
        run: pnpm run test:coverage
      - name: Build (all packages)
        run: pnpm exec turbo run build
      - name: Prisma schema validate
        run: pnpm run prisma:validate
        env:
          DATABASE_URL: postgresql://montr:montr@localhost:5432/montr?schema=public

  # ---------------------------------------------------------------------------
  # Golden-corpus regression gate (§4.7). Blocks the release on any regression
  # of precision / recall / FP-rate vs the committed corpus/baseline.json.
  #
  # ⛔ REAL-MODE (A2 fix): this job runs the REAL apps/worker pipeline (real
  # App Map, real semgrep/gitleaks discovery, real correlation, real static
  # confirmation — FAKE in-process LLM gateway only, same offline pattern as
  # `apps/worker/src/e2e-scan.test.ts`, so no live LLM credentials needed)
  # against every golden-corpus repo via `scripts/corpus-scan.mjs`, then scores
  # that REAL scan.json against ground truth via `qa:corpus -- --findings`.
  # It NEVER falls back to the synthetic `perfectScanner` self-check (that
  # tautologically echoes ground truth back at itself and can never fail — see
  # `qa:corpus:selfcheck` for that plumbing smoke test, which is NOT this gate).
  # ---------------------------------------------------------------------------
  golden-corpus:
    name: golden-corpus regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Real Layer-1 discovery tools. Best-effort: a missing binary degrades
      # that detector to empty + a warning (never a hard failure) rather than
      # silently falling back to a synthetic candidate pile — so a missing
      # scanner shows up as lower recall in the score below, not as green CI.
      - name: Install semgrep (real SAST discovery)
        run: python3 -m pip install --quiet --disable-pip-version-check semgrep
      - name: Install gitleaks (real secrets discovery)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # Runs the real L0→L3 pipeline over corpus/repos, corpus/<stack>-vuln|clean,
      # and the @montr/fixtures seed repos (vitest against source — no build
      # step needed), and writes the aggregated confirmed findings to scan.json.
      - name: Real-pipeline scan of the golden corpus
        run: node scripts/corpus-scan.mjs --out scan.json

      # Score the REAL scan.json (never the no-arg self-check) against ground
      # truth, exiting NON-ZERO on any regression (0 OK · 1 REGRESSION ·
      # 2 USAGE · 3 CORPUS_ERROR · 4 RUNTIME).
      - name: Precision/recall/FP-rate gate (non-zero on regression)
        run: pnpm --filter @montr/qa qa:corpus -- --findings ${{ github.workspace }}/scan.json

      - name: Upload real scan.json (debugging a regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-corpus-scan
          path: scan.json
          if-no-files-found: ignore

      # ⛔ Model-variance harness (A23 — PRD §15/§17: publish the model matrix
      # and catch accuracy cliffs). Prior to A23 this ran the tautological
      # `perfectConfirmedForRepo` echo, which ignores the model entirely — every
      # row scored an identical 100% and no cliff could ever show up. `qa:variance`
      # (no flags) now runs the REAL `@montr/confirm` static-confirmation engine
      # once per model in the matrix — same offline pattern as the golden-corpus
      # scan above (FAKE in-process LLM gateway, no live provider credentials or
      # spend needed), except the fake gateway here is deliberately configured to
      # DIFFER per model (`packages/qa/src/real-confirmation-scanner.ts`'s
      # `gatewayForModel`), so a genuine accuracy cliff (a below-floor model
      # missing findings a floor-or-better model catches) produces a REAL,
      # different recall per row rather than reproducing today's bug. Gates on
      # floor-or-better models only (`qa:variance`'s own exit code); a
      # below-floor cliff is surfaced in the printed matrix as informational,
      # never a blocker — see `docs/infra/testing.md`.
      - name: Model-variance matrix — per-model accuracy cliff check (non-zero on a floor-or-better regression)
        run: pnpm --filter @montr/qa qa:variance

      # ⛔ Blue-team detection-corpus gate (B12 — the blue-team mirror of this
      # job's golden-corpus scan above). Runs the REAL B3 detection-rule
      # generator (packages/report/src/detection-rules) and the REAL B5
      # purple-team evaluator (packages/confirm/src/purple-loop.ts's
      # runPurpleTeamScenario, identically gated to every other scenario
      # caller) against 9 hand-traced, ground-truth-labelled scenarios from
      # the real REDTEAM_SCENARIO_CATALOGUE (packages/state-store/src/redteam-catalogue.ts)
      # — fully offline (in-process fake HTTP transport, never a real socket;
      # no live LLM/provider credentials needed, same pattern as the
      # golden-corpus scan above). Scores the real per-scenario fired/not-fired
      # verdicts against corpus/blue-team-baseline.json's committed thresholds,
      # exiting non-zero on a detection-precision/recall regression — see
      # docs/infra/testing.md and packages/qa/src/blue-team-corpus.ts's header
      # for exactly how each label was traced and why 9 of the 13 catalogue
      # templates are covered (not all 13).
      - name: Real blue-team detection-corpus run (B12)
        run: node scripts/blue-team-corpus-scan.mjs --out blue-team-scan.json

      - name: Blue-team detection-precision/recall gate (non-zero on regression)
        run: pnpm --filter @montr/qa qa:blue-team-corpus -- --findings ${{ github.workspace }}/blue-team-scan.json

      - name: Upload real blue-team-scan.json (debugging a regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-team-corpus-scan
          path: blue-team-scan.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Self-scan / dogfood (§4.8, §14, §19 DoD "scans itself clean"; fixes A7).
  #
  # Two complementary checks:
  #
  #   1. Raw Semgrep + Gitleaks CLI (SARIF → GitHub Security tab). Best-effort /
  #      informational: different tuning (broader rulesets, tool-native severity)
  #      than the product's own pipeline, so it is a visibility aid, not the gate.
  #      Intentionally-vulnerable corpus/fixtures are excluded (they plant vulns
  #      on purpose; see `.github/gitleaks.toml`'s allowlist for the same reasoning
  #      applied to gitleaks).
  #
  #   2. `pnpm run selfscan` (scripts/selfscan.mjs) — THE real dogfood gate. Runs
  #      the REAL apps/worker L0→L3 pipeline (real App Map, real semgrep/gitleaks
  #      discovery, real correlation, real static confirmation — FAKE in-process
  #      LLM gateway only, so no live LLM credentials needed, same pattern as
  #      `apps/worker/src/e2e-scan.test.ts` / `scripts/corpus-scan.mjs`) against
  #      THIS repo's own source tree and fails the build on any un-allowlisted
  #      HIGH/CRITICAL confirmed finding (see `scripts/selfscan.allowlist.json`
  #      for the narrowly-scoped, documented-exception mechanism — never a
  #      blanket suppression). This is a BLOCKING gate (no `continue-on-error`):
  #      the product genuinely scans itself with its own detection tech, and a
  #      real finding against Montr Secure's own source fails CI.
  # ---------------------------------------------------------------------------
  self-scan:
    name: self-scan (dogfood — real pipeline, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Semgrep SAST (best-effort, informational — SARIF for the Security tab)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --disable-pip-version-check semgrep \
            || { echo "semgrep unavailable — skipping (best-effort)"; exit 0; }
          # Informational only — the REAL blocking gate is `pnpm run selfscan`
          # below. Metrics off (§10: no vendor telemetry).
          semgrep scan --metrics=off \
            --config p/owasp-top-ten --config p/typescript --config p/react \
            --config p/javascript --config p/secrets \
            --exclude packages/fixtures/sample-repos --exclude corpus/repos \
            --sarif --output semgrep.sarif \
            || echo "semgrep reported findings/errors (see artifact; best-effort)"
      - name: Gitleaks secret scan (best-effort, redacted — SARIF for the Security tab)
        continue-on-error: true
        run: |
          # --redact so no secret body is ever printed (golden rule #1 / §14).
          # Allowlist scopes out planted/example secrets (.github/gitleaks.toml).
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --no-git --source /repo \
            --config /repo/.github/gitleaks.toml \
            --redact --report-format sarif --report-path /repo/gitleaks.sarif \
            || echo "gitleaks reported findings or is unavailable (see artifact; best-effort)"
      - name: Install semgrep (real SAST discovery for the pipeline self-scan)
        run: python3 -m pip install --quiet --disable-pip-version-check semgrep
      - name: Install gitleaks (real secrets discovery for the pipeline self-scan)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      # ⛔ THE real dogfood gate — BLOCKING (no continue-on-error). Runs the real
      # apps/worker pipeline against this repo's own source; fails on any
      # un-allowlisted HIGH/CRITICAL confirmed finding. See scripts/selfscan.mjs.
      - name: Montr self-scan (real pipeline vs. own source — blocking)
        run: pnpm run selfscan
      - name: Upload self-scan artifacts (SARIF + real-pipeline findings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-scan-results
          path: |
            semgrep.sarif
            gitleaks.sarif
            selfscan.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Docker: validate compose is well-formed, then build the images.
  # ---------------------------------------------------------------------------
  docker:
    name: docker build (compose images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose
        run: |
          cp deploy/docker/.env.example deploy/docker/.env
          docker compose -f deploy/docker/docker-compose.yml config -q
      - name: Build images
        run: docker compose -f deploy/docker/docker-compose.yml build

  # ---------------------------------------------------------------------------
  # Integration smoke (suggested enhancement — "compose up, hit /health, run
  # one scan end to end"; the single test that would have caught A1 (real
  # entrypoints), A3 (web/API contract), and A5 (Helm web args) before they
  # were checked off). Runs AFTER `docker` (needs:) so the images it builds
  # are already known-good compose-config-valid; this job builds them again
  # from the (Docker-layer-cached) same Dockerfiles because GitHub Actions
  # jobs run on fresh runners with no shared image cache between jobs — see
  # scripts/integration-smoke.mjs for why a shared artifact isn't worth the
  # complexity here (a `docker save`/`load` round-trip of 3 images is slower
  # than a cached rebuild on the same Dockerfiles `docker` just validated).
  #
  # Brings up the REAL compose stack the way deploy/docker/README.md documents
  # it — a single `docker compose up -d`, with the one-shot `migrate` job pulled
  # in automatically by api/worker's `depends_on`. It must NOT migrate by hand:
  # doing so is what previously let a broken documented bring-up keep passing
  # CI. Polls the real /health endpoint, registers +
  # logs in a user, creates a real scan against the vulnerable-nextjs fixture
  # via the real /api/v1/scans route, and asserts the real worker container
  # persisted a real Layer-0 App Map + cost estimate back to real Postgres —
  # readable through the real api container. No live LLM key is available in
  # CI, so Layers 2/3 are not waited on (every LLM call site in this codebase
  # degrades gracefully rather than crashing — see the script's header).
  # ---------------------------------------------------------------------------
  integration-smoke:
    name: integration smoke (compose up + real scan)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run the real docker-compose integration smoke test
        run: node scripts/integration-smoke.mjs
      - name: Dump container logs (debugging a failure)
        if: failure()
        run: |
          docker compose -f deploy/docker/docker-compose.yml logs --no-color --tail=300 || true
      - name: Tear down (always — even on failure, matches the script's own cleanup)
        if: always()
        run: |
          docker compose -f deploy/docker/docker-compose.yml down -v --remove-orphans || true

  # ---------------------------------------------------------------------------
  # Helm: lint (strict) + template (default + key permutations) + kubeconform
  # schema validation of the rendered manifests.
  # ---------------------------------------------------------------------------
  helm:
    name: helm lint + template + kubeconform
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/montr-secure
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint (strict)
        run: helm lint --strict "$CHART"
      - name: helm template (default + permutations render clean)
        run: |
          set -euo pipefail
          helm template montr "$CHART" > /dev/null
          # Vault/CSI secret provider path.
          helm template montr "$CHART" --set secrets.csi.enabled=true > /dev/null
          # External managed datastores (bundled Postgres/Redis disabled).
          helm template montr "$CHART" \
            --set postgres.enabled=false --set redis.enabled=false \
            --set secrets.databaseUrl='postgresql://u:p@db:5432/montr?schema=public' \
            --set redis.externalUrl='redis://redis:6379' > /dev/null
          # Autoscaling + Ingress + restrictive NetworkPolicy ingress.
          helm template montr "$CHART" \
            --set api.autoscaling.enabled=true --set worker.autoscaling.enabled=true \
            --set ingress.enabled=true --set networkPolicy.ingress.enabled=true > /dev/null
      - name: Validate rendered manifests (kubeconform, best-effort)
        continue-on-error: true
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform || { echo "kubeconform unavailable — skipping (best-effort)"; exit 0; }
          helm template montr "$CHART" \
            | ./kubeconform -strict -summary -kubernetes-version 1.28.0 -ignore-missing-schemas

  # ---------------------------------------------------------------------------
  # Supply chain (§4.8): syft SBOM + cosign signing. Guarded / best-effort so a
  # missing tool, absent OIDC token (fork PRs), or missing registry credentials
  # NEVER breaks CI. Release image signing runs on version tags only.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: SBOM (syft) + sign (cosign) — best-effort
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push release images to GHCR (tags only)
      id-token: write # cosign keyless (OIDC); absent on fork PRs → sign self-skips
    steps:
      - uses: actions/checkout@v4

      # ---- SBOM of the workspace (dependency inventory), every run ----
      - name: Generate SBOM (syft)
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: montr-secure.spdx.json
          output-file: montr-secure.spdx.json
          upload-artifact: true

      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@v3

      # ---- Keyless-sign the SBOM (main/tags only; needs OIDC) ----
      - name: Keyless-sign SBOM (best-effort)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          COSIGN_YES: "true"
        run: |
          if ! command -v cosign >/dev/null 2>&1; then echo "cosign not installed — skipping"; exit 0; fi
          if [ ! -f montr-secure.spdx.json ]; then echo "no SBOM to sign — skipping"; exit 0; fi
          cosign sign-blob --yes montr-secure.spdx.json \
            --output-signature montr-secure.spdx.json.sig \
            --output-certificate montr-secure.spdx.json.pem \
            || echo "keyless signing unavailable (no OIDC?) — skipping (best-effort)"

      - name: Upload SBOM signature (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbom-signature
          path: |
            montr-secure.spdx.json.sig
            montr-secure.spdx.json.pem
          if-no-files-found: ignore

      # ---- Signed RELEASE images + SBOM attestation (version tags only) ----
      - name: Set up Buildx
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push, cosign-sign & attest release images (keyless)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          COSIGN_YES: "true"
        run: |
          command -v cosign >/dev/null 2>&1 || { echo "cosign missing — skipping release signing"; exit 0; }
          command -v syft >/dev/null 2>&1 || echo "syft missing — image SBOMs will be skipped"
          for comp in api worker web; do
            repo="ghcr.io/${GITHUB_REPOSITORY}-${comp}"
            tag="${GITHUB_REF_NAME}"
            echo "::group::${comp} → ${repo}:${tag}"
            if docker buildx build --push \
                 -f "deploy/docker/Dockerfile.${comp}" \
                 -t "${repo}:${tag}" \
                 --metadata-file "/tmp/meta-${comp}.json" .; then
              digest="$(jq -r '."containerimage.digest"' "/tmp/meta-${comp}.json")"
              cosign sign --yes "${repo}@${digest}" || echo "sign ${comp} skipped (best-effort)"
              if command -v syft >/dev/null 2>&1; then
                syft "${repo}@${digest}" -o spdx-json="sbom-${comp}.spdx.json" \
                  && cosign attest --yes --type spdxjson \
                       --predicate "sbom-${comp}.spdx.json" "${repo}@${digest}" \
                  || echo "attest ${comp} skipped (best-effort)"
              fi
            else
              echo "build/push ${comp} failed — skipping (best-effort)"
            fi
            echo "::endgroup::"
          done
