apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "montr.fullname" . }}-api
  labels:
    {{- include "montr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "montr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "montr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include "montr.configJson" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "montr.serviceAccountName" (dict "ctx" . "component" "api") }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "montr.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "montr.image" (dict "ctx" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["dist/index.js"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "montr.fullname" . }}-config
            - secretRef:
                name: {{ include "montr.secretName" . }}
          {{- if .Values.api.probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            initialDelaySeconds: 25
            periodSeconds: 30
            timeoutSeconds: 3
          {{- end }}
          securityContext:
            {{- include "montr.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: appconfig
              mountPath: /etc/montr/config.json
              subPath: config.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secrets.csi.enabled }}
            - name: montr-secrets
              mountPath: {{ .Values.secrets.csi.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: appconfig
          configMap:
            name: {{ include "montr.fullname" . }}-appconfig
        - name: tmp
          emptyDir: {}
        {{- if .Values.secrets.csi.enabled }}
        - name: montr-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "montr.fullname" . }}-spc
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
