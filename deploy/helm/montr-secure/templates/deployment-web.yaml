apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "montr.fullname" . }}-web
  labels:
    {{- include "montr.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "montr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "montr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Least privilege: the console gets NO Secret (no LLM key, no DB URL).
      serviceAccountName: {{ include "montr.serviceAccountName" (dict "ctx" . "component" "web") }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "montr.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "montr.image" (dict "ctx" . "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: PORT
              value: {{ .Values.web.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "montr.fullname" . }}-config
          {{- if .Values.web.probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.web.probes.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.web.probes.path }}
              port: http
            initialDelaySeconds: 25
            periodSeconds: 30
            timeoutSeconds: 3
          {{- end }}
          securityContext:
            {{- include "montr.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
