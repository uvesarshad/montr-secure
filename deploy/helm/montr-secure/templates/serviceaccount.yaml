{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "montr.serviceAccountName" . }}
  labels:
    {{- include "montr.labels" . | nindent 4 }}
# Least-privilege: no token auto-mount, no RBAC bindings by default.
automountServiceAccountToken: false
{{- end }}
