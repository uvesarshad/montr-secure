{{- if .Values.serviceAccount.create }}
{{- /* One least-privilege ServiceAccount per component: no token auto-mount,
       no RBAC bindings. Separate identities so they can be bound individually
       (e.g. IRSA / workload identity) without over-granting. */ -}}
{{- range $component := (list "api" "worker" "web") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "montr.serviceAccountName" (dict "ctx" $ "component" $component) }}
  labels:
    {{- include "montr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
