{{- if .Values.networkPolicy.enabled }}
{{- /*
⛔ DEFAULT-DENY EGRESS (§14, golden rule #1). Applies to every pod in the
release (api/worker/web/postgres/redis). The ONLY egress permitted is:
  - DNS (so Services resolve),
  - intra-namespace traffic (postgres/redis/api/web talk to each other),
  - the client's LLM endpoint (scope networkPolicy.llmEndpoint.cidr!),
  - any operator-supplied networkPolicy.extraEgress (e.g. an external managed
    DB/Redis when the bundled datastores are disabled).
Everything else is denied — no client source can leave except inside the LLM call.
*/ -}}
{{- $llmCidr := required "networkPolicy.llmEndpoint.cidr is required. Resolve your configured LLM provider's egress IP range and set it via --set networkPolicy.llmEndpoint.cidr=<CIDR> or a values override — see DEPLOY.md." .Values.networkPolicy.llmEndpoint.cidr }}
{{- if eq $llmCidr "0.0.0.0/0" }}
{{- fail "networkPolicy.llmEndpoint.cidr must not be 0.0.0.0/0 — that would permit egress to ANY host on the LLM port, defeating the default-deny egress guarantee (§4.6). Set it to your LLM provider's real CIDR — see DEPLOY.md." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "montr.fullname" . }}-default-deny-egress
  labels:
    {{- include "montr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "montr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicy.dns.enabled }}
    # DNS resolution.
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Intra-namespace service traffic (postgres, redis, api, web).
    - to:
        - podSelector: {}
    # ⛔ Client LLM endpoint — the only permitted external egress.
    - to:
        - ipBlock:
            cidr: {{ $llmCidr | quote }}
            {{- with .Values.networkPolicy.llmEndpoint.except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.llmEndpoint.port }}
    {{- with .Values.networkPolicy.extraEgress }}
    # Operator-supplied extra egress (internal proxy / external datastores).
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.networkPolicy.ingress.enabled }}
---
# Optional restrictive ingress to the app pods (same namespace + listed ones).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "montr.fullname" . }}-ingress
  labels:
    {{- include "montr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "montr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingress.fromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
{{- end }}
{{- end }}
