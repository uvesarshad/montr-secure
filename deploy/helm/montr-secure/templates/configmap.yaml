apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "montr.fullname" . }}-config
  labels:
    {{- include "montr.labels" . | nindent 4 }}
data:
  # Infra endpoints + pointer to the mounted MontrConfig JSON. All other config
  # lives in the -appconfig ConfigMap (config.json) and secrets in the Secret/CSI.
  REDIS_URL: {{ include "montr.redisUrl" . | quote }}
  MONTR_CONFIG_FILE: "/etc/montr/config.json"
  {{- if .Values.secrets.csi.enabled }}
  MONTR_SECRETS_DIR: {{ .Values.secrets.csi.mountPath | quote }}
  {{- end }}
