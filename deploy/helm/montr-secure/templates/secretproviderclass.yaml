{{- if .Values.secrets.csi.enabled }}
{{- /*
Vault / Secrets Store CSI option. Requires the secrets-store CSI driver + the
chosen provider (e.g. Vault) installed in the cluster. Secrets are mounted as
FILES at secrets.csi.mountPath; the loader reads them via MONTR_SECRETS_DIR
(objectName MUST match the loader's SECRET_FILE_MAP: llm-api-key,
field-encryption-key). See loader.ts + deploy/helm README (Vault/CSI section).
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "montr.fullname" . }}-spc
  labels:
    {{- include "montr.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secrets.csi.provider }}
  parameters:
    roleName: {{ .Values.secrets.csi.parameters.roleName | quote }}
    vaultAddress: {{ .Values.secrets.csi.parameters.vaultAddress | quote }}
    objects: |
      {{- range .Values.secrets.csi.objects }}
      - objectName: {{ .objectName | quote }}
        secretPath: {{ .secretPath | quote }}
        secretKey: {{ .secretKey | quote }}
      {{- end }}
{{- end }}
