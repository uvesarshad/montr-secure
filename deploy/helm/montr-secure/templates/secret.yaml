{{- /*
Chart-managed app Secret. Skipped when secrets.existingSecret is set (BYO).
In CSI mode the LLM key + field-encryption key come from the CSI volume, so
this Secret carries only the datastore credentials.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- if or .Values.secrets.create .Values.secrets.csi.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "montr.fullname" .) }}
  labels:
    {{- include "montr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.secrets.csi.enabled }}
  # ⛔ BYO client LLM key — the only outbound credential. Prefer
  # `--set-file secrets.llmApiKey=./llm.key`. Never commit a real key.
  MONTR_LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  MONTR_FIELD_ENCRYPTION_KEY_REF: {{ .Values.secrets.fieldEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  {{- $pw := include "montr.postgresPassword" . }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:%v/%s?schema=public" .Values.postgres.auth.username $pw (include "montr.fullname" .) (.Values.postgres.port | int) .Values.postgres.auth.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required when postgres.enabled=false" .Values.secrets.databaseUrl | quote }}
  {{- end }}
{{- end }}
{{- end }}
