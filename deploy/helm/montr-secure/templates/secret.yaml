{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "montr.secretName" . }}
  labels:
    {{- include "montr.labels" . | nindent 4 }}
type: Opaque
stringData:
  # BYO client LLM key + field-encryption key. Provide via --set-file in prod.
  MONTR_LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  MONTR_FIELD_ENCRYPTION_KEY_REF: {{ .Values.secrets.fieldEncryptionKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
{{- end }}
